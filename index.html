<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>My Tasks</h1>
                <p class="subtitle">Stay focused, get things done.</p>
            </div>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
        </div>

        <div class="input-container">
            <input
                type="text"
                id="todoInput"
                placeholder="Add a new task..."
                class="todo-input"
                maxlength="200"
            >
            <button id="addBtn" class="add-button">
                <span class="add-icon">+</span> Add
            </button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="stats">
            <span class="stats-count" id="statsCount">No tasks</span>
            <button class="clear-completed" id="clearCompleted" disabled>Clear completed</button>
        </div>

        <ul id="todoList" class="todo-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
